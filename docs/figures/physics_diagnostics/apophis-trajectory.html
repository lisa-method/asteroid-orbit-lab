}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    (() =&gt; {
      const root = document.getElementById(&#x27;apophis-orbit-view&#x27;);

      const svg = root.querySelector(&#x27;.map&#x27;);
      const select = root.querySelector(&#x27;#apophis-scale&#x27;);

      const ns = &#x27;http://www.w3.org/2000/svg&#x27;;
      const fmt = (x,n=0) =&gt; (Math.abs(x)&lt;1e-10?0:x).toLocaleString(&#x27;ru-RU&#x27;,{maximumFractionDigits:n});
      const create = (tag,attrs,text) =&gt; {
        const el=document.createElementNS(ns,tag);
        Object.entries(attrs).forEach(([key,val])=&gt;el.setAttribute(key,val));
        if(text!==undefined) el.textContent=text;
        svg.appendChild(el); return el;
      };
      function draw() {
        const near = select.value === &#x27;encounter&#x27;;
        const rows = near ? data.encounter : data.solar;
        const index = Math.min(+slider.value,rows.length-1), row=rows[index];
        const width = Math.max(280,svg.getBoundingClientRect().width);
        const height = Math.min(480,width+20);
        svg.setAttribute(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`);
        svg.setAttribute(&#x27;height&#x27;,height);
        svg.replaceChildren();
        create(&#x27;title&#x27;,{},near?&#x27;Пролёт Апофиса у Земли: 13–14 апреля 2029&#x27;:&#x27;Гелиоцентрическая траектория Апофиса в 2029 году&#x27;);
        create(&#x27;desc&#x27;,{},&#x27;Двумерная проекция сохранённых эфемерид, не новая интеграция. Расстояния под картой вычислены в трёх измерениях.&#x27;);
        const keys=near?[&#x27;a&#x27;,&#x27;e&#x27;,&#x27;m&#x27;]:[&#x27;a&#x27;,&#x27;e&#x27;,&#x27;v&#x27;];
        const points=rows.flatMap(r=&gt;keys.map(k=&gt;r[k])); points.push([0,0]);
        const xs=points.map(p=&gt;p[0]),ys=points.map(p=&gt;p[1]);
        const loX=Math.min(...xs),hiX=Math.max(...xs),loY=Math.min(...ys),hiY=Math.max(...ys);
        const left=64,right=16,top=18,bottom=50;
        const span=Math.max(hiX-loX,hiY-loY)*1.13;
        const scale=Math.min(width-left-right,height-top-bottom)/span;
        const cx=(loX+hiX)/2,cy=(loY+hiY)/2;
        const px=x=&gt;(left+width-right)/2+(x-cx)*scale;
        const py=y=&gt;(top+height-bottom)/2-(y-cy)*scale;
        const xMin=cx-(width-left-right)/2/scale,xMax=cx+(width-left-right)/2/scale;
        const yMin=cy-(height-top-bottom)/2/scale,yMax=cy+(height-top-bottom)/2/scale;
        create(&#x27;rect&#x27;,{&#x27;data-chart-frame&#x27;:&#x27;&#x27;,x:left,y:top,width:width-left-right,height:height-top-bottom,fill:&#x27;none&#x27;,stroke:&#x27;var(--border)&#x27;});
        function ticks(lo,hi,n=4) { const raw=(hi-lo)/n,power=10**Math.floor(Math.log10(raw)),step=[1,2,2.5,5,10].find(v=&gt;v*power&gt;=raw)*power; const out=[]; for(let x=Math.ceil(lo/step)*step;x&lt;=hi;x+=step)out.push(x);return out.length&gt;4?out.filter((_,i)=&gt;i%2===0):out; }
        for(const t of ticks(xMin,xMax)) {
          create(&#x27;line&#x27;,{x1:px(t),x2:px(t),y1:top,y2:height-bottom,stroke:&#x27;var(--border)&#x27;,&#x27;stroke-width&#x27;:.7});
          create(&#x27;text&#x27;,{x:px(t),y:height-bottom+20,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},fmt(near?t/1000:t,near?0:1));
        }
        for(const t of ticks(yMin,yMax)) {
          create(&#x27;line&#x27;,{x1:left,x2:width-right,y1:py(t),y2:py(t),stroke:&#x27;var(--border)&#x27;,&#x27;stroke-width&#x27;:.7});
          create(&#x27;text&#x27;,{x:left-8,y:py(t)+4,&#x27;text-anchor&#x27;:&#x27;end&#x27;},fmt(near?t/1000:t,near?0:1));
        }
        create(&#x27;text&#x27;,{class:&#x27;axis-title&#x27;,&#x27;data-axis&#x27;:&#x27;x&#x27;,x:(left+width-right)/2,y:height-8,&#x27;text-anchor&#x27;:&#x27;middle&#x27;},near?&#x27;X от Земли, тыс. км&#x27;:&#x27;X от Солнца, а.е.&#x27;);
        create(&#x27;text&#x27;,{class:&#x27;axis-title&#x27;,&#x27;data-axis&#x27;:&#x27;y&#x27;,x:16,y:(top+height-bottom)/2,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,transform:`rotate(-90 16 ${(top+height-bottom)/2})`},near?&#x27;Y от Земли, тыс. км&#x27;:&#x27;Y от Солнца, а.е.&#x27;);
        const colors=[&#x27;var(--viz-series-1)&#x27;,&#x27;var(--viz-series-2)&#x27;,&#x27;var(--viz-series-3)&#x27;];
        keys.forEach((key,j)=&gt;{
          if(!(near&amp;&amp;key===&#x27;e&#x27;)) {
            const path=rows.map((r,i)=&gt;`${i?&#x27;L&#x27;:&#x27;M&#x27;}${px(r[key][0]).toFixed(2)},${py(r[key][1]).toFixed(2)}`).join(&#x27; &#x27;);
            create(&#x27;path&#x27;,{d:path,fill:&#x27;none&#x27;,stroke:colors[j],&#x27;stroke-width&#x27;:j===0?2.4:1.1,&#x27;stroke-opacity&#x27;:j===0?1:.65});
          }
          const [x,y]=row[key],sx=px(x),sy=py(y);
          if(j===0)create(&#x27;circle&#x27;,{cx:sx,cy:sy,r:5,fill:colors[j]});
          else if(j===1)create(&#x27;path&#x27;,{d:`M${sx} ${sy-6}L${sx+6} ${sy}L${sx} ${sy+6}L${sx-6} ${sy}Z`,fill:colors[j]});
          else create(&#x27;rect&#x27;,{x:sx-4,y:sy-4,width:8,height:8,fill:colors[j]});
        });
        if(!near) {
          create(&#x27;circle&#x27;,{cx:px(0),cy:py(0),r:5,fill:&#x27;var(--foreground)&#x27;});
          create(&#x27;text&#x27;,{x:px(0)+10,y:py(0)+4},&#x27;Солнце&#x27;);
        } else {
          create(&#x27;circle&#x27;,{cx:px(0),cy:py(0),r:6378.1366*scale,fill:&#x27;none&#x27;,stroke:&#x27;var(--viz-series-2)&#x27;});
        }
        output.textContent=row.date.replace(&#x27;T&#x27;,&#x27; &#x27;).slice(0,near?16:10)+&#x27; TDB&#x27;;
        detail.textContent=near?`До центра Земли: ${fmt(row.distance)} км`:`До Солнца: ${fmt(row.sun,3)} а.е. · до Земли: ${fmt(row.distance/1e6,2)} млн км`;
        root.querySelector(&#x27;#apophis-other-name&#x27;).textContent=near?&#x27;Луна ■&#x27;:&#x27;Венера ■&#x27;;
        root.querySelector(&#x27;#apophis-frame&#x27;).textContent=near?&#x27;Относительно центра Земли · эклиптика J2000 · проекция XY&#x27;:&#x27;Эклиптика J2000 · одинаковый масштаб осей · размеры маркеров условные&#x27;;
      }
      select.addEventListener(&#x27;change&#x27;,()=&gt;{
        const near=select.value===&#x27;encounter&#x27;;
        slider.max=(near?data.encounter:data.solar).length-1;
        slider.value=near?data.closest_index:0;
        draw();
      });
      slider.addEventListener(&#x27;input&#x27;,draw);
      new ResizeObserver(draw).observe(svg);
      draw();
    })();
